<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0f2740;
    --muted: #5b6b7f;
    --line: #dbe4ee;
    --amber: #f4b740;
    --amber-deep: #d9971a;
    --free: #16a34a;
    --busy: #e5484d;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: linear-gradient(180deg, #eaf1f8, #f6f9fc) no-repeat fixed;
    font-family: var(--body); line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 16px 64px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .24em;
    text-transform: uppercase; margin: 0; }

  /* departure-board header (the signature) */
  .board {
    background: linear-gradient(180deg, #12283f, #0d1f33); color: #fff;
    border-radius: 18px; padding: 16px 20px; margin-bottom: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 16px 34px -18px rgba(9,22,38,.65);
  }
  .board-id { display: flex; align-items: center; gap: 14px; }
  .board .plane { font-size: 22px; color: var(--amber); line-height: 1; }
  .board .eyebrow { color: #8fa6bf; display: block; margin-bottom: 7px; }
  .flap { display: flex; gap: 4px; }
  .flap-tile {
    position: relative; min-width: 24px; height: 32px; padding: 0 5px; display: grid; place-items: center;
    background: #081627; color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 17px;
    border-radius: 5px; text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .flap-tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: rgba(0,0,0,.55); transform: translateY(-.5px); }
  .board-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* tabs live on the dark board */
  .tabs { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; gap: 3px; }
  .tab { border: 0; background: transparent; color: #cdd9e6; padding: 7px 15px; border-radius: 8px;
    font-family: var(--display); font-weight: 500; font-size: 14px; cursor: pointer; transition: .12s; }
  .tab:hover { color: #fff; }
  .tab.on { background: var(--amber); color: #10233b; }

  /* buttons */
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; font-family: var(--body);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: .12s;
  }
  .btn:hover { background: #f5f8fb; }
  .btn.primary { background: var(--amber); color: #10233b; border-color: var(--amber-deep); font-weight: 600; }
  .btn.primary:hover { background: var(--amber-deep); }
  .btn.small { padding: 6px 11px; font-size: 13px; }
  .btn.danger { color: var(--busy); border-color: #f6c6c8; background: #fff; }
  .btn.danger:hover { background: #fdecec; }
  .btn.ghost { background: rgba(255,255,255,.06); color: #e6eef7; border-color: rgba(255,255,255,.16); }
  .btn.ghost:hover { background: rgba(255,255,255,.13); }
  .btn:disabled { opacity: .4; cursor: default; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 820px) { .grid { grid-template-columns: 340px 1fr; } }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    box-shadow: 0 1px 2px rgba(15,39,64,.04), 0 14px 30px -20px rgba(15,39,64,.2); }
  .card + .card { margin-top: 18px; }
  .card h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: #eef3f8; border-radius: 999px; padding: 2px 9px; }

  .row { display: flex; gap: 8px; }
  .inp { width: 100%; border: 1px solid #c4d2e0; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: var(--body); background: #fff; outline: none; transition: .12s; }
  .inp:focus { border-color: var(--amber-deep); box-shadow: 0 0 0 3px rgba(244,183,64,.25); }
  .inp.num { width: 96px; font-family: var(--mono); }

  #roster { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .person { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    border-radius: 11px; padding: 9px 12px; transition: .12s; }
  .person.active { border-color: var(--amber-deep); background: #fff8ea; }
  .person .pick { flex: 1; display: flex; align-items: center; gap: 8px; background: none;
    border: 0; padding: 0; cursor: pointer; text-align: left; min-width: 0; }
  .person .name { font-size: 14px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person.active .name { color: var(--amber-deep); }
  .tally { margin-left: auto; font-family: var(--mono); font-size: 12px; display: flex; gap: 8px; white-space: nowrap; }
  .tally .f { color: var(--free); } .tally .b { color: var(--busy); } .tally .p { color: var(--amber-deep); }
  .person .del { border: 0; background: none; color: #c4d2e0; cursor: pointer; font-size: 17px; line-height: 1; padding: 0 2px; }
  .person .del:hover { color: var(--busy); }
  .empty { border: 1px dashed #c4d2e0; border-radius: 11px; padding: 22px 14px;
    text-align: center; font-size: 13px; color: #8497aa; }

  label.field { display: block; font-size: 14px; margin-bottom: 14px; }
  label.field > span:first-child { display: block; color: var(--ink); font-weight: 500; margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 400; }

  /* segmented controls */
  .seg { display: inline-flex; background: #eef3f8; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px;
    font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; transition: .12s; }
  .seg button:hover { color: var(--ink); }
  .seg.avail button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,39,64,.14); }
  .seg.mode button[data-mark="free"].on { background: var(--free); color: #fff; }
  .seg.mode button[data-mark="busy"].on { background: var(--busy); color: #fff; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #monthLabel { font-family: var(--mono); font-size: 14px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
  .nav { border: 1px solid var(--line); background: #fff; border-radius: 9px;
    width: 36px; height: 36px; cursor: pointer; font-size: 17px; color: var(--muted); }
  .nav:hover { background: #f5f8fb; color: var(--ink); }
  #calHint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  #calHint b { color: var(--ink); }

  .markbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .markbar .lab { font-size: 12px; color: var(--muted); }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }

  .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays div { text-align: center; font-family: var(--mono); font-size: 11px; color: #9aabbd; padding-bottom: 2px; }
  .cal-grid { margin-top: 4px; user-select: none; }
  .day {
    position: relative; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; color: var(--ink); cursor: pointer;
    transition: box-shadow .1s, transform .05s; touch-action: none;
  }
  .day .n { line-height: 1; font-weight: 500; }
  .day .c { font-size: 9.5px; line-height: 1; margin-top: 3px; font-weight: 700; }
  .day .star { position: absolute; top: 3px; right: 5px; font-size: 9px; line-height: 1; color: var(--amber-deep); }
  .day .busytag { position: absolute; top: 3px; left: 5px; font-size: 8.5px; line-height: 1; font-weight: 700; color: var(--busy); }
  .day .rtag { font-size: 7.5px; line-height: 1; margin-top: 3px; font-weight: 700; text-transform: lowercase;
    max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day.holi::after { content: ""; position: absolute; bottom: 3px; left: 4px; width: 4px; height: 4px;
    border-radius: 50%; background: #6366f1; }
  .day:not(.disabled):hover { box-shadow: 0 0 0 2px var(--amber); z-index: 1; }
  .day:not(.disabled):active { transform: scale(.95); }
  .day.disabled { cursor: default; color: #b7c4d2; }
  .day.mine { box-shadow: 0 0 0 2px var(--free); }
  .day.mine-busy { box-shadow: 0 0 0 2px var(--busy); }
  .day.today { outline: 2px dotted #9aabbd; outline-offset: 1px; }
  /* availability heat (green) */
  .h-none { background: #fff; color: #8497aa; }
  .h-few  { background: #dcfce7; color: #166534; border-color: #dcfce7; }
  .h-half { background: #bbf7d0; color: #166534; border-color: #bbf7d0; }
  .h-most { background: #86efac; color: #14532d; border-color: #86efac; }
  .h-all  { background: #22c55e; color: #fff; border-color: #22c55e; }
  .h-all .star { color: #fff; } .h-all .busytag { color: #fff; }
  /* conflict heat (red) */
  .b-few  { background: #ffe4e6; color: #9f1239; border-color: #ffe4e6; }
  .b-some { background: #fda4af; color: #881337; border-color: #fda4af; }
  .b-all  { background: #f43f5e; color: #fff; border-color: #f43f5e; }
  .b-some .busytag, .b-all .busytag, .b-all .star { color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  #results ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .win { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--line); background: #fbfdff; border-radius: 12px; padding: 11px 14px; }
  .win.clear { border-color: #bbf7d0; background: #f0fdf4; }
  .win .range { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink); }
  .win .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .badge { flex: none; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700;
    white-space: nowrap; font-family: var(--body); }
  .badge.clear { background: #22c55e; color: #fff; }
  .badge.pref { background: #fff3d6; color: var(--amber-deep); }
  .summary { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eef3f8; font-size: 12px; color: var(--muted); }
  .summary b { color: var(--ink); }
  .footnote { font-size: 12px; color: #8497aa; margin-top: 16px; padding: 0 2px; }

  /* booking */
  .notice { background: #fff8ea; border: 1px solid #f6dd9e; color: #7a5a12;
    border-radius: 14px; padding: 15px 17px; font-size: 13px; margin-bottom: 24px; line-height: 1.55; }
  .notice b { color: #5c440d; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .fgrid { grid-template-columns: 1fr; } }
  .hint.fail, .fail { color: var(--busy); }
  .hint.ok, .ok { color: var(--free); }
  .rev { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .rev th, .rev td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rev th { color: var(--muted); font-weight: 600; font-size: 12px; font-family: var(--body); }
  .rev td { font-family: var(--mono); }

  /* landing — boarding pass */
  .landing { max-width: 460px; margin: 8vh auto; }
  .pass { border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 24px 54px -26px rgba(15,39,64,.4); }
  .pass-top { background: linear-gradient(180deg, #12283f, #0d1f33); color: #fff;
    padding: 16px 22px; display: flex; align-items: center; gap: 11px; }
  .pass-top .plane { font-size: 20px; color: var(--amber); }
  .pass-top .eyebrow { color: #8fa6bf; }
  .pass-body { background: #fff; padding: 24px 22px 26px; }
  .pass-body h1 { font-size: 24px; margin: 0 0 8px; }
  .pass-body p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .or { text-align: center; color: #9aabbd; font-size: 11px; margin: 18px 0 10px;
    text-transform: uppercase; letter-spacing: .18em; }
  .setup { background: #fff8ea; border: 1px solid #f6dd9e; color: #7a5a12;
    border-radius: 12px; padding: 15px; font-size: 14px; line-height: 1.5; }
  .setup code { background: #fbeecb; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 13px; }

  /* trip name on the board */
  .tripname-row { display: flex; align-items: center; gap: 8px; margin: 3px 0 8px; }
  .tripname { font-family: var(--display); font-weight: 700; font-size: 19px; color: #fff; letter-spacing: -.01em; }
  .tripname.placeholder { color: #6f86a0; font-weight: 500; font-style: italic; cursor: pointer; }
  .editname { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #cdd9e6;
    width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .editname:hover { background: rgba(255,255,255,.16); color: #fff; }

  /* busy reason chips */
  .reasonwrap { display: inline-flex; align-items: center; gap: 8px; }
  .seg.reason button.on { background: var(--amber); color: #10233b; }

  /* group: shared roster + trips */
  .subhead { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #9aabbd;
    margin: 16px 0 8px; font-family: var(--mono); }
  .addlist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 7px; }
  .addlist button { border: 1px dashed #c4d2e0; background: #fff; color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: var(--body); transition: .12s; }
  .addlist button:hover { border-color: var(--amber-deep); color: var(--ink); background: #fff8ea; }
  .triplist { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .triprow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; transition: .12s; }
  .triprow:hover { border-color: var(--amber-deep); background: #fff8ea; }
  .triprow .tname { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--ink); }
  .triprow .tcode { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .triprow .tlock { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--free); white-space: nowrap; }

  /* lock banner + locked calendar days */
  .lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .lockbar .rng { font-family: var(--mono); font-weight: 700; }
  .lockbtn { margin-top: 8px; }
  .day.locked { cursor: default; }
  .day .lock { position: absolute; bottom: 3px; right: 4px; font-size: 8px; opacity: .8; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================================================================
   Trip Planner — one shared calendar. Everyone marks availability
   once; agreed windows become named trips that then block those
   people from clashing future windows.
   ================================================================ */
const SUPABASE_URL = "https://usqohrjsvqmmmjdytwjv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9nJccohxBaaSMAdJbP1JCQ_VfK7ip6U";
const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR-PROJECT") &&
  !SUPABASE_ANON_KEY.includes("YOUR-ANON-KEY");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const firstOfThisMonth = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); };

const state = {
  cal: null, calName: "",
  members: [],        // {id,name,days,prefers,busy,busyReasons,locked}
  trips: [],          // {id,name,date_from,date_to,going:[memberId]}
  selectedId: null,   // member being edited
  view: firstOfThisMonth(),
  minLen: 1, maxDrop: 0,
  markMode: "free", busyReason: null, availMode: "notbusy",
  tab: "calendar",    // "calendar" | "trips"
  openTrip: null,     // trip id open in the Trips tab
  bookings: [],       // encrypted bookings for the open trip
  drag: null,
  lastEditAt: 0,
  mode: "cal",        // "cal" | "landing"
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* ---- date helpers (verified) ---- */
const fmt = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const prettyRange = (from, to) => {
  const a = parse(from), b = parse(to);
  const opt = { month: "short", day: "numeric" };
  const left = a.toLocaleDateString("en-US", opt);
  if (from === to) return left;
  const same = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  return `${left} - ${same ? b.getDate() : b.toLocaleDateString("en-US", opt)}`;
};

/* ---- Philippine public non-working holidays ---- */
// Most are fixed dates or computable; Holy Week comes from Easter, National Heroes
// Day is the last Monday of August. Chinese New Year (lunar) is a short lookup.
// Eid'l Fitr / Eid'l Adha are declared by separate proclamation and are NOT included.
function easterSunday(y) {                       // Anonymous Gregorian algorithm
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const mth = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * mth + 114) / 31);
  const day = ((h + l - 7 * mth + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
const CNY = { 2025: "01-29", 2026: "02-17", 2027: "02-06", 2028: "01-26", 2029: "02-13", 2030: "02-03" };
const _holiCache = {};
function phHolidays(year) {
  if (_holiCache[year]) return _holiCache[year];
  const h = {};
  const set = (mmdd, name) => { h[`${year}-${mmdd}`] = name; };
  // fixed regular holidays
  set("01-01", "New Year's Day");
  set("04-09", "Araw ng Kagitingan");
  set("05-01", "Labor Day");
  set("06-12", "Independence Day");
  set("11-30", "Bonifacio Day");
  set("12-25", "Christmas Day");
  set("12-30", "Rizal Day");
  // fixed special non-working days
  set("08-21", "Ninoy Aquino Day");
  set("11-01", "All Saints' Day");
  set("11-02", "All Souls' Day");
  set("12-08", "Immaculate Conception");
  set("12-24", "Christmas Eve");
  set("12-31", "Last Day of the Year");
  // Holy Week (from Easter)
  const easter = easterSunday(year);
  h[fmt(addDays(easter, -3))] = "Maundy Thursday";
  h[fmt(addDays(easter, -2))] = "Good Friday";
  h[fmt(addDays(easter, -1))] = "Black Saturday";
  // National Heroes Day = last Monday of August
  let aug = new Date(year, 7, 31);
  while (aug.getDay() !== 1) aug = addDays(aug, -1);
  h[fmt(aug)] = "National Heroes Day";
  // Chinese New Year (lunar lookup)
  if (CNY[year]) h[`${year}-${CNY[year]}`] = "Chinese New Year";

const b64 = (bytes) => { const a = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes); let s = ""; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };

  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);

/* ================= finder ================= */
function computeWindows() {
  const people = state.members, total = people.length;
  if (!total) return { windows: [], noConflict: 0, hasMarks: false };
  const free = {}, pref = {}, busy = {};
  const marks = new Set();
  for (const p of people) {
    const lset = new Set(Object.keys(p.locked || {}));
    for (const d of p.days) if (!lset.has(d)) { free[d] = (free[d] || 0) + 1; marks.add(d); }
    for (const d of (p.prefers || [])) if (!lset.has(d)) pref[d] = (pref[d] || 0) + 1;
    for (const d of (p.busy || [])) { busy[d] = (busy[d] || 0) + 1; marks.add(d); }
    for (const d of lset) { busy[d] = (busy[d] || 0) + 1; marks.add(d); }
  }
  const marked = [...marks].sort();
  if (!marked.length) return { windows: [], noConflict: 0, hasMarks: false };
  const avail = (ds) => state.availMode === "free" ? (free[ds] || 0) : (total - (busy[ds] || 0));
  const start = parse(marked[0]), end = parse(marked[marked.length - 1]);
  const all = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) all.push(fmt(d));
  const noConflict = all.filter((ds) => !(busy[ds] || 0)).length;
  const windows = [];
  let i = 0;
  while (i < all.length) {
    if (total - avail(all[i]) <= state.maxDrop) {
      let j = i;
      while (j < all.length && total - avail(all[j]) <= state.maxDrop) j++;
      const run = all.slice(i, j);
      if (run.length >= state.minLen) {
        const busyMap = new Map(), unconfirmed = new Set();
        let prefSum = 0, freeSum = 0;
        for (const rd of run) {
          prefSum += pref[rd] || 0; freeSum += free[rd] || 0;
          for (const p of people) {
            const lk = p.locked && p.locked[rd];
            if (lk) { if (!busyMap.has(p.name)) busyMap.set(p.name, new Set()); busyMap.get(p.name).add(lk); }
            else if ((p.busy || []).includes(rd)) {
              if (!busyMap.has(p.name)) busyMap.set(p.name, new Set());
              const r = (p.busyReasons || {})[rd]; if (r) busyMap.get(p.name).add(r);
            } else if (!p.days.includes(rd)) unconfirmed.add(p.name);
          }
        }
        const bz = [...busyMap.entries()].map(([name, rs]) => ({ name, reasons: [...rs] })).sort((a, b) => a.name.localeCompare(b.name));
        windows.push({ from: run[0], to: run[run.length - 1], len: run.length, busy: bz, unconfirmed: [...unconfirmed],
          prefScore: prefSum / run.length, freeScore: freeSum / run.length, preferred: prefSum / run.length >= 1 });
      }
      i = j;
    } else i++;
  }
  windows.sort((a, b) => a.busy.length - b.busy.length || b.prefScore - a.prefScore || b.freeScore - a.freeScore || b.len - a.len);
  return { windows: windows.slice(0, 12), noConflict, hasMarks: true };
}

async function toggleDay(ds) {
  const p = currentMember(); if (!p) return;
  if (p.locked && p.locked[ds]) return;   // on a trip — read-only
  const prefers = p.prefers || [], busy = p.busy || [], reasons = p.busyReasons || {};

    if (busy.includes(ds)) {
      if (state.busyReason && rs[ds] !== state.busyReason) rs[ds] = state.busyReason;
      else { bus = busy.filter((d) => d !== ds); delete rs[ds]; }
    } else {
      bus = [...busy, ds];
      if (state.busyReason) rs[ds] = state.busyReason;
      days = p.days.filter((d) => d !== ds); prefs = prefers.filter((d) => d !== ds);
    }
  } else {
    if (busy.includes(ds)) { bus = busy.filter((d) => d !== ds); delete rs[ds]; days = [...p.days, ds]; }
    else if (!p.days.includes(ds)) days = [...p.days, ds];
    else if (!prefers.includes(ds)) prefs = [...prefers, ds];

  if (action === "setFree") { p.busy = rm(p.busy); delete p.busyReasons[ds]; if (!p.days.includes(ds)) p.days = [...p.days, ds]; }
  else if (action === "clearFree") { p.days = rm(p.days); p.prefers = rm(p.prefers); }

// runs of consecutive non-working days (weekend or PH holiday) that are 3+ days long
function longWeekends(from, months) {
  const start = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const end = new Date(start.getFullYear(), start.getMonth() + months, start.getDate());
  const isOff = (d) => { const wd = d.getDay(); return wd === 0 || wd === 6 || !!holidayName(fmt(d)); };
  const runs = []; let d = new Date(start);
  while (d <= end) {
    if (isOff(d)) {
      const runStart = new Date(d); const names = [];
      while (d <= end && isOff(d)) { const h = holidayName(fmt(d)); if (h) names.push(h); d = addDays(d, 1); }
      const runEnd = addDays(d, -1);
      const len = Math.round((runEnd - runStart) / 86400000) + 1;
      if (len >= 3 && names.length) runs.push({ from: fmt(runStart), to: fmt(runEnd), len, label: names.join(" / ") });
    } else d = addDays(d, 1);
  }
  return runs;
}
function fillLongWeekends() {
  const sel = document.getElementById("lwJump"); if (!sel) return;
  const runs = longWeekends(new Date(), 14);
  sel.innerHTML = `<option value="">&#127958; Jump to a long weekend&hellip;</option>` +
    runs.map((r) => `<option value="${r.from}">${prettyRange(r.from, r.to)} · ${r.len} days · ${escapeHtml(r.label)}</option>`).join("");
}

  updateRoster(); updateCalendar(); updateResults();

function updateRoster() {
  const pc = document.getElementById("peopleCount"); if (pc) pc.textContent = state.members.length;
  const ul = document.getElementById("roster"); if (!ul) return;
  ul.innerHTML = state.members.length ? state.members.map((p) => {
    const b = (p.busy || []).length, pr = (p.prefers || []).length;
    return `<li class="person ${p.id === state.selectedId ? "active" : ""}">
      <button class="pick" data-select="${p.id}">
        <span class="name">${escapeHtml(p.name)}</span>
        <span class="tally"><span class="f">${p.days.length} free</span>${b ? `<span class="b">${b} busy</span>` : ""}${pr ? `<span class="p">&#9733;${pr}</span>` : ""}</span>
      </button>
      <button class="del" data-remove="${p.id}" title="Remove">&times;</button></li>`;
  }).join("") : `<li class="empty">Add everyone first, then tap a name to mark their days.</li>`;
}
async function addMember() {
  const input = document.getElementById("nameInput"); const name = input.value.trim(); if (!name) return;
  input.value = "";
  const row = await peopleAdd(name); if (!row) return;
  state.members = [...state.members, row].sort((a, b) => a.name.localeCompare(b.name));
  state.selectedId = row.id;
  updateRoster(); updateCalendar(); updateResults();
}
async function removeMember(id) {
  state.members = state.members.filter((m) => m.id !== id);
  if (state.selectedId === id) state.selectedId = state.members[0]?.id ?? null;
  // drop from any trip's going list
  for (const t of state.trips) { if ((t.going || []).includes(id)) { t.going = t.going.filter((g) => g !== id); tripUpdate(t.id, { going: t.going }); } }
  applyTripOverlay();
  updateRoster(); updateCalendar(); updateResults();
  await peopleDelete(id);
}

function updateCalendar() {
  const total = state.members.length;
  const y = state.view.getFullYear(), m = state.view.getMonth();
  document.getElementById("monthLabel").textContent = state.view.toLocaleString("en-US", { month: "long", year: "numeric" });
  const selected = currentMember();
  const painting = state.markMode === "busy"
    ? `<b>busy</b> days — pick a reason if you like, then tap or drag. It shows on the day.`
    : `<b>free</b> days — tap once free, twice prefer &#9733;, drag to fill`;
  document.getElementById("calHint").innerHTML = selected ? `Marking <b>${escapeHtml(selected.name)}</b>'s ${painting}` : `Pick someone on the left to start marking days`;
  const sc = document.getElementById("shortcuts"); if (sc) sc.querySelectorAll("button").forEach((b) => (b.disabled = !selected));
  const mm = document.getElementById("markMode"); if (mm) mm.querySelectorAll("button").forEach((b) => (b.disabled = !selected));
  const rb = document.getElementById("reasonBar"); if (rb) rb.hidden = !(selected && state.markMode === "busy");
  const startWd = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate(), today = fmt(new Date());
  let html = "";
  for (let i = 0; i < startWd; i++) html += `<div></div>`;
  for (let d = 1; d <= dim; d++) {
    const ds = fmt(new Date(y, m, d));
    const { free: f, busy: b, title } = dayInfo(ds);
    const iLocked = selected && selected.locked && selected.locked[ds];
    const iFree = selected && selected.days.includes(ds) && !iLocked;
    const iBusy = selected && (selected.busy || []).includes(ds);
    const myPref = selected && (selected.prefers || []).includes(ds);
    const myReason = (iBusy && !iLocked) ? (selected.busyReasons || {})[ds] : "";
    const holi = holidayName(ds);
    html += `<button class="day ${dayClass(f, b, total)} ${iFree ? "mine" : ""} ${(iBusy || iLocked) ? "mine-busy" : ""} ${iLocked ? "locked" : ""} ${holi ? "holi" : ""} ${ds === today ? "today" : ""} ${selected ? "" : "disabled"}" data-day="${ds}" ${title ? `title="${escapeHtml(title)}"` : ""} ${selected ? "" : "disabled"}>${cellInner(d, f, b, myPref, iLocked || "", myReason || "")}</button>`;
  }
  document.getElementById("calGrid").innerHTML = html;
  const hl = document.getElementById("holiList");
  if (hl) {
    const items = [];
    for (let d = 1; d <= dim; d++) {
      const dt = new Date(y, m, d), h = holidayName(fmt(dt));
      if (h) items.push(`${dt.toLocaleDateString("en-US", { month: "short", day: "numeric" })} ${h}`);
    }
    hl.innerHTML = items.length ? `<b>&#127477;&#127469; holidays this month:</b> ${items.map(escapeHtml).join(" &middot; ")}` : "";
  }
}

function updateResults() {
  const total = state.members.length;
  const { windows, noConflict, hasMarks } = computeWindows();
  const box = document.getElementById("results"); if (!box) return;
  let body;
  if (!total) body = `<p class="hint">Add people, then mark days to see what fits.</p>`;
  else if (!hasMarks) body = `<p class="hint">Mark some days — free or busy — and the windows that work show up here.</p>`;
  else if (!windows.length) body = `<p class="hint">Nothing fits with these settings. Try a shorter minimum, or allow more people to miss it.</p>`;
  else {
    const strict = state.availMode === "free";
    body = "<ul>" + windows.map((w) => {
      const clear = w.busy.length === 0 && (!strict || w.unconfirmed.length === 0);
      let note;
      if (clear) note = "no conflicts";
      else {
        const parts = [];
        if (w.busy.length) parts.push("busy: " + w.busy.map((b) => escapeHtml(b.name) + (b.reasons.length ? ` (${b.reasons.map(escapeHtml).join(", ")})` : "")).join(", "));
        if (strict && w.unconfirmed.length) parts.push("not confirmed: " + w.unconfirmed.map(escapeHtml).join(", "));
        note = parts.join(" · ");
      }
      return `<li class="win ${clear ? "clear" : ""}">
        <div>
          <div class="range">${prettyRange(w.from, w.to)}</div>
          <div class="meta">${w.len} day${w.len === 1 ? "" : "s"} in a row &middot; ${note}</div>
          <button class="btn small lockbtn" data-make="${w.from}|${w.to}">Make this a trip</button>
        </div>
        <div class="tags">${w.preferred ? `<span class="badge pref">&#9733; preferred</span>` : ""}${clear ? `<span class="badge clear">clear</span>` : ""}</div>
      </li>`;
    }).join("") + "</ul>";
    if (noConflict > 0) body += `<p class="summary"><b>${noConflict}</b> day${noConflict === 1 ? "" : "s"} in range ${noConflict === 1 ? "has" : "have"} nobody marked busy.</p>`;
  }
  box.innerHTML = body;
}

async function makeTrip(from, to) {
  // default "who's going" = everyone free across the whole span (no busy, not already on a trip)
  const span = []; for (let d = parse(from); d <= parse(to); d = addDays(d, 1)) span.push(fmt(d));
  const going = state.members.filter((m) => span.every((ds) => !(m.busy || []).includes(ds) && !(m.locked && m.locked[ds]))).map((m) => m.id);
  const name = (window.prompt(`Name this trip (${prettyRange(from, to)})`, "") || "").trim().slice(0, 60);
  const trip = await tripAdd(name, from, to, going);
  if (!trip) return;
  state.trips = [...state.trips, trip].sort((a, b) => a.date_from.localeCompare(b.date_from));
  applyTripOverlay();
  state.tab = "trips"; state.openTrip = trip.id;
  render();
}

      <h2 style="margin-top:12px;">${trip.name ? escapeHtml(trip.name) : "Untitled trip"}

    <div class="card">
      <h2>Booking details <span class="count">encrypted</span></h2>
      <div class="notice">Each person's passport-level details are <b>encrypted in the browser</b> with a passphrase you all agree on. The server only ever stores unreadable text — even the host can't read it without the passphrase.</div>
      <p class="subhead">Add or update your details</p>
      <div id="bkFormWrap">
        <label class="field"><span>You are</span>
          <select class="inp" id="bkWho">${(trip.going || []).map((id) => byId[id] ? `<option value="${id}">${escapeHtml(byId[id].name)}</option>` : "").join("")}</select></label>
        <div class="fgrid">
          <label class="field"><span>Full legal name</span><input class="inp" id="bkName" /></label>
          <label class="field"><span>Date of birth</span><input class="inp" id="bkDob" placeholder="1990-05-20" /></label>

async function bookingSave(trip) {
  const msg = document.getElementById("bkSaveMsg");
  if (!cryptoReady()) { msg.textContent = "Needs https or localhost to encrypt."; msg.className = "hint fail"; return; }
  const memberId = document.getElementById("bkWho").value;
  const member = state.members.find((m) => m.id === memberId);
  const phrase = document.getElementById("bkPhrase").value;
  if (!member || !phrase) { msg.textContent = "Pick who you are and enter the passphrase."; msg.className = "hint fail"; return; }
  const obj = {
    fullName: document.getElementById("bkName").value.trim(),
    dob: document.getElementById("bkDob").value.trim(),
    nationality: document.getElementById("bkNat").value.trim(),
    passport: document.getElementById("bkPass").value.trim(),
    passportExpiry: document.getElementById("bkExp").value.trim(),
    frequentFlyer: document.getElementById("bkFF").value.trim(),
    seat: document.getElementById("bkSeat").value.trim(),
    notes: document.getElementById("bkNotes").value.trim(),
  };
  const blob = await encryptJSON(obj, phrase);
  await bkUpsert(trip.id, memberId, member.name, blob);
  msg.textContent = "Saved (encrypted)."; msg.className = "hint ok";
  ["bkName","bkDob","bkNat","bkPass","bkExp","bkFF","bkSeat","bkNotes","bkPhrase"].forEach((id) => (document.getElementById(id).value = ""));
}
async function bookingUnlock(trip) {
  const out = document.getElementById("bkTable");
  const phrase = document.getElementById("bkUnlockPhrase").value;
  if (!phrase) { out.innerHTML = `<p class="hint fail">Enter the shared passphrase.</p>`; return; }
  const rows = await bkFetch(trip.id) || [];
  if (!rows.length) { out.innerHTML = `<p class="hint">Nobody's added details yet.</p>`; return; }
  const okRows = [], failRows = [];
  for (const r of rows) { try { okRows.push({ name: r.name, id: r.id, d: await decryptJSON(r.blob, phrase) }); } catch { failRows.push(r.name); } }
  const cols = [["fullName","Name"],["dob","DOB"],["nationality","Nationality"],["passport","Passport"],["passportExpiry","Expiry"],["frequentFlyer","FF#"],["seat","Seat"],["notes","Notes"]];
  let html = "";
  if (okRows.length) {
    html += `<table class="rev"><thead><tr><th>Person</th>${cols.map((c) => `<th>${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>`;
    html += okRows.map((r) => `<tr><td>${escapeHtml(r.name)}</td>${cols.map((c) => `<td>${escapeHtml(r.d[c[0]] || "")}</td>`).join("")}<td><button class="btn small" data-copy='${escapeHtml(JSON.stringify({ name: r.name, ...r.d }))}'>Copy</button></td></tr>`).join("");
    html += `</tbody></table><div style="margin-top:10px;"><button class="btn small" id="bkCopyAll">Copy all</button> <button class="btn danger small" id="bkDelAll">Delete all details</button></div>`;
  }
  if (failRows.length) html += `<p class="hint fail" style="margin-top:8px;">Couldn't unlock (different passphrase): ${failRows.map(escapeHtml).join(", ")}</p>`;
  out.innerHTML = html;
  const allText = okRows.map((r) => `${r.name}: ` + cols.map((c) => `${c[1]}=${r.d[c[0]] || ""}`).join(", ")).join("\n");
  const ca = document.getElementById("bkCopyAll"); if (ca) ca.onclick = () => navigator.clipboard.writeText(allText);
  out.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => navigator.clipboard.writeText(b.dataset.copy)));
  const da = document.getElementById("bkDelAll"); if (da) da.onclick = async () => { if (window.confirm("Delete everyone's booking details for this trip?")) { await bkDeleteAll(trip.id); bookingUnlock(trip); } };
}

            <div class="row"><input class="inp" id="joinCode" placeholder="Enter a calendar code" /><button class="btn" id="joinBtn">Join</button></div>
          ` : `
            <div class="setup">Almost there — open <code>index.html</code> and paste your Supabase <code>Project URL</code> and <code>publishable key</code> into the CONFIG block at the top. The README walks through it.</div>`}
        </div>
      </div>
    </div>`;
  if (!configured) return;
  document.getElementById("createBtn").onclick = async () => {
    const code = Math.random().toString(36).slice(2, 9);
    await calCreate(code, "");
    location.search = "?cal=" + code;
  };
  document.getElementById("joinBtn").onclick = joinFromInput;
  document.getElementById("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") joinFromInput(); });
}
function joinFromInput() {
  const code = document.getElementById("joinCode").value.trim();
  if (code) location.search = "?cal=" + encodeURIComponent(code);
}

/* ================= boot + live sync ================= */
async function loadAll() {
  const people = await peopleFetch();
  const trips = await tripsFetch();
  if (people) state.members = people;
  if (trips) state.trips = trips;
  applyTripOverlay();
  if (!state.members.find((m) => m.id === state.selectedId)) state.selectedId = state.members[0]?.id ?? null;
}
async function boot() {
  const cal = new URLSearchParams(location.search).get("cal");
  if (!configured || !cal) { state.mode = "landing"; renderLanding(); return; }
  const c = await calFetch(cal);
  if (!c) { state.mode = "landing"; renderLanding(); return; }
  state.mode = "cal"; state.cal = cal; state.calName = c.name;
  await loadAll();
  render();
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
}
async function poll() {
  if (!sb || document.visibilityState !== "visible" || state.mode !== "cal") return;
  if (state.drag) return;
  if (Date.now() - state.lastEditAt < 2500) return;
  const c = await calFetch(state.cal);
  if (c && c.name !== state.calName) { state.calName = c.name; updateCalNameEl(); }
  await loadAll();
  // refresh only the light, non-focus-stealing bits of whichever tab is open
  if (state.tab === "calendar") { if (document.getElementById("calGrid")) { updateRoster(); updateCalendar(); updateResults(); } }
}
boot();
</script>
