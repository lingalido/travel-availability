<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0f2740;
    --muted: #5b6b7f;
    --line: #dbe4ee;
    --amber: #f4b740;
    --amber-deep: #d9971a;
    --free: #16a34a;
    --busy: #e5484d;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono: 'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: linear-gradient(180deg, #eaf1f8, #f6f9fc) no-repeat fixed;
    font-family: var(--body); line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 16px 64px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .24em;
    text-transform: uppercase; margin: 0; }

  /* departure-board header (the signature) */
  .board {
    background: linear-gradient(180deg, #12283f, #0d1f33); color: #fff;
    border-radius: 18px; padding: 16px 20px; margin-bottom: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 16px 34px -18px rgba(9,22,38,.65);
  }
  .board-id { display: flex; align-items: center; gap: 14px; }
  .board .plane { font-size: 22px; color: var(--amber); line-height: 1; }
  .board .eyebrow { color: #8fa6bf; display: block; margin-bottom: 7px; }
  .flap { display: flex; gap: 4px; }
  .flap-tile {
    position: relative; min-width: 24px; height: 32px; padding: 0 5px; display: grid; place-items: center;
    background: #081627; color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 17px;
    border-radius: 5px; text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .flap-tile::after { content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: rgba(0,0,0,.55); transform: translateY(-.5px); }
  .board-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* tabs live on the dark board */
  .tabs { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; gap: 3px; }
  .tab { border: 0; background: transparent; color: #cdd9e6; padding: 7px 15px; border-radius: 8px;
    font-family: var(--display); font-weight: 500; font-size: 14px; cursor: pointer; transition: .12s; }
  .tab:hover { color: #fff; }
  .tab.on { background: var(--amber); color: #10233b; }

  /* buttons */
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; font-family: var(--body);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: .12s;
  }
  .btn:hover { background: #f5f8fb; }
  .btn.primary { background: var(--amber); color: #10233b; border-color: var(--amber-deep); font-weight: 600; }
  .btn.primary:hover { background: var(--amber-deep); }
  .btn.small { padding: 6px 11px; font-size: 13px; }
  .btn.danger { color: var(--busy); border-color: #f6c6c8; background: #fff; }
  .btn.danger:hover { background: #fdecec; }
  .btn.ghost { background: rgba(255,255,255,.06); color: #e6eef7; border-color: rgba(255,255,255,.16); }
  .btn.ghost:hover { background: rgba(255,255,255,.13); }
  .btn:disabled { opacity: .4; cursor: default; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 820px) { .grid { grid-template-columns: 340px 1fr; } }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    box-shadow: 0 1px 2px rgba(15,39,64,.04), 0 14px 30px -20px rgba(15,39,64,.2); }
  .card + .card { margin-top: 18px; }
  .card h2 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
  .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: #eef3f8; border-radius: 999px; padding: 2px 9px; }

  .row { display: flex; gap: 8px; }
  .inp { width: 100%; border: 1px solid #c4d2e0; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: var(--body); background: #fff; outline: none; transition: .12s; }
  .inp:focus { border-color: var(--amber-deep); box-shadow: 0 0 0 3px rgba(244,183,64,.25); }
  .inp.num { width: 96px; font-family: var(--mono); }

  #roster { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .person { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    border-radius: 11px; padding: 9px 12px; transition: .12s; }
  .person.active { border-color: var(--amber-deep); background: #fff8ea; }
  .person .pick { flex: 1; display: flex; align-items: center; gap: 8px; background: none;
    border: 0; padding: 0; cursor: pointer; text-align: left; min-width: 0; }
  .person .name { font-size: 14px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person.active .name { color: var(--amber-deep); }
  .tally { margin-left: auto; font-family: var(--mono); font-size: 12px; display: flex; gap: 8px; white-space: nowrap; }
  .tally .f { color: var(--free); } .tally .b { color: var(--busy); } .tally .p { color: var(--amber-deep); }
  .person .del { border: 0; background: none; color: #c4d2e0; cursor: pointer; font-size: 17px; line-height: 1; padding: 0 2px; }
  .person .del:hover { color: var(--busy); }
  .empty { border: 1px dashed #c4d2e0; border-radius: 11px; padding: 22px 14px;
    text-align: center; font-size: 13px; color: #8497aa; }

  label.field { display: block; font-size: 14px; margin-bottom: 14px; }
  label.field > span:first-child { display: block; color: var(--ink); font-weight: 500; margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 400; }

  /* segmented controls */
  .seg { display: inline-flex; background: #eef3f8; border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px;
    font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; transition: .12s; }
  .seg button:hover { color: var(--ink); }
  .seg.avail button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,39,64,.14); }
  .seg.mode button[data-mark="free"].on { background: var(--free); color: #fff; }
  .seg.mode button[data-mark="busy"].on { background: var(--busy); color: #fff; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #monthLabel { font-family: var(--mono); font-size: 14px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
  .nav { border: 1px solid var(--line); background: #fff; border-radius: 9px;
    width: 36px; height: 36px; cursor: pointer; font-size: 17px; color: var(--muted); }
  .nav:hover { background: #f5f8fb; color: var(--ink); }
  #calHint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
  #calHint b { color: var(--ink); }

  .markbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .markbar .lab { font-size: 12px; color: var(--muted); }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }

  .weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .weekdays div { text-align: center; font-family: var(--mono); font-size: 11px; color: #9aabbd; padding-bottom: 2px; }
  .cal-grid { margin-top: 4px; user-select: none; }
  .day {
    position: relative; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; color: var(--ink); cursor: pointer;
    transition: box-shadow .1s, transform .05s; touch-action: none;
  }
  .day .n { line-height: 1; font-weight: 500; }
  .day .c { font-size: 9.5px; line-height: 1; margin-top: 3px; font-weight: 700; }
  .day .star { position: absolute; top: 3px; right: 5px; font-size: 9px; line-height: 1; color: var(--amber-deep); }
  .day .busytag { position: absolute; top: 3px; left: 5px; font-size: 8.5px; line-height: 1; font-weight: 700; color: var(--busy); }
  .day:not(.disabled):hover { box-shadow: 0 0 0 2px var(--amber); z-index: 1; }
  .day:not(.disabled):active { transform: scale(.95); }
  .day.disabled { cursor: default; color: #b7c4d2; }
  .day.mine { box-shadow: 0 0 0 2px var(--free); }
  .day.mine-busy { box-shadow: 0 0 0 2px var(--busy); }
  .day.today { outline: 2px dotted #9aabbd; outline-offset: 1px; }
  /* availability heat (green) */
  .h-none { background: #fff; color: #8497aa; }
  .h-few  { background: #dcfce7; color: #166534; border-color: #dcfce7; }
  .h-half { background: #bbf7d0; color: #166534; border-color: #bbf7d0; }
  .h-most { background: #86efac; color: #14532d; border-color: #86efac; }
  .h-all  { background: #22c55e; color: #fff; border-color: #22c55e; }
  .h-all .star { color: #fff; } .h-all .busytag { color: #fff; }
  /* conflict heat (red) */
  .b-few  { background: #ffe4e6; color: #9f1239; border-color: #ffe4e6; }
  .b-some { background: #fda4af; color: #881337; border-color: #fda4af; }
  .b-all  { background: #f43f5e; color: #fff; border-color: #f43f5e; }
  .b-some .busytag, .b-all .busytag, .b-all .star { color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  #results ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .win { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--line); background: #fbfdff; border-radius: 12px; padding: 11px 14px; }
  .win.clear { border-color: #bbf7d0; background: #f0fdf4; }
  .win .range { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink); }
  .win .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .badge { flex: none; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700;
    white-space: nowrap; font-family: var(--body); }
  .badge.clear { background: #22c55e; color: #fff; }
  .badge.pref { background: #fff3d6; color: var(--amber-deep); }
  .summary { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eef3f8; font-size: 12px; color: var(--muted); }
  .summary b { color: var(--ink); }
  .footnote { font-size: 12px; color: #8497aa; margin-top: 16px; padding: 0 2px; }

  /* booking */
  .notice { background: #fff8ea; border: 1px solid #f6dd9e; color: #7a5a12;
    border-radius: 14px; padding: 15px 17px; font-size: 13px; margin-bottom: 24px; line-height: 1.55; }
  .notice b { color: #5c440d; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .fgrid { grid-template-columns: 1fr; } }
  .hint.fail, .fail { color: var(--busy); }
  .hint.ok, .ok { color: var(--free); }
  .rev { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .rev th, .rev td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rev th { color: var(--muted); font-weight: 600; font-size: 12px; font-family: var(--body); }
  .rev td { font-family: var(--mono); }

  /* landing — boarding pass */
  .landing { max-width: 460px; margin: 8vh auto; }
  .pass { border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 24px 54px -26px rgba(15,39,64,.4); }
  .pass-top { background: linear-gradient(180deg, #12283f, #0d1f33); color: #fff;
    padding: 16px 22px; display: flex; align-items: center; gap: 11px; }
  .pass-top .plane { font-size: 20px; color: var(--amber); }
  .pass-top .eyebrow { color: #8fa6bf; }
  .pass-body { background: #fff; padding: 24px 22px 26px; }
  .pass-body h1 { font-size: 24px; margin: 0 0 8px; }
  .pass-body p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .or { text-align: center; color: #9aabbd; font-size: 11px; margin: 18px 0 10px;
    text-transform: uppercase; letter-spacing: .18em; }
  .setup { background: #fff8ea; border: 1px solid #f6dd9e; color: #7a5a12;
    border-radius: 12px; padding: 15px; font-size: 14px; line-height: 1.5; }
  .setup code { background: #fbeecb; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 13px; }

  /* trip name on the board */
  .tripname-row { display: flex; align-items: center; gap: 8px; margin: 3px 0 8px; }
  .tripname { font-family: var(--display); font-weight: 700; font-size: 19px; color: #fff; letter-spacing: -.01em; }
  .tripname.placeholder { color: #6f86a0; font-weight: 500; font-style: italic; cursor: pointer; }
  .editname { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #cdd9e6;
    width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .editname:hover { background: rgba(255,255,255,.16); color: #fff; }

  /* busy reason chips */
  .reasonwrap { display: inline-flex; align-items: center; gap: 8px; }
  .seg.reason button.on { background: var(--amber); color: #10233b; }

  /* group: shared roster + trips */
  .subhead { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #9aabbd;
    margin: 16px 0 8px; font-family: var(--mono); }
  .addlist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 7px; }
  .addlist button { border: 1px dashed #c4d2e0; background: #fff; color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: var(--body); transition: .12s; }
  .addlist button:hover { border-color: var(--amber-deep); color: var(--ink); background: #fff8ea; }
  .triplist { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .triprow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; transition: .12s; }
  .triprow:hover { border-color: var(--amber-deep); background: #fff8ea; }
  .triprow .tname { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--ink); }
  .triprow .tcode { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .triprow .tlock { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--free); white-space: nowrap; }

  /* lock banner + locked calendar days */
  .lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .lockbar .rng { font-family: var(--mono); font-weight: 700; }
  .lockbtn { margin-top: 8px; }
  .day.locked { cursor: default; }
  .day .lock { position: absolute; bottom: 3px; right: 4px; font-size: 8px; opacity: .8; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   CONFIG — paste your Supabase project values here (see README).
   Use the publishable key (sb_publishable_...), or the anon key on older
   projects — both belong in client code and are limited by your database
   policies. Passport-type data goes in the Booking tab, where it's encrypted.
   ========================================================================= */
const SUPABASE_URL = "https://usqohrjsvqmmmjdytwjv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9nJccohxBaaSMAdJbP1JCQ_VfK7ip6U";

/* ---- setup / client ---- */
const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR-PROJECT") &&
  !SUPABASE_ANON_KEY.includes("YOUR-ANON-KEY");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---- state ---- */
const state = {
  room: null,
  tripName: "",
  group: null,       // group code, if this trip/hub belongs to a group
  groupName: "",
  members: [],       // shared roster [{id,name}]
  groupTrips: [],    // sibling trips [{room,name,lock_from,lock_to}]
  lockFrom: null,    // this trip's locked range (the agreed dates)
  lockTo: null,
  mode: "trip",      // "trip" | "group" | "landing"
  people: [],
  selectedId: null,
  view: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  minLen: 1,
  maxDrop: 0,
  lastEditAt: 0,
  tab: "schedule",   // "schedule" | "booking"
  markMode: "free",  // which state a tap/drag paints: "free" | "busy"
  busyReason: null,  // optional label applied to newly-marked busy days
  availMode: "notbusy", // count someone available when: "notbusy" | "free"
  drag: null,        // active drag-to-fill on the calendar
  bookings: [],      // encrypted booking entries for this room
};

/* ---- date helpers (verified) ---- */
const fmt = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const prettyRange = (from, to) => {
  const a = parse(from), b = parse(to);
  const opt = { month: "short", day: "numeric" };
  const left = a.toLocaleDateString("en-US", opt);
  if (from === to) return left;
  const same = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  return `${left} - ${same ? b.getDate() : b.toLocaleDateString("en-US", opt)}`;
};

/* ---- overlap logic ---- */
function computeWindows() {
  const people = state.people, total = people.length;
  if (!total) return { windows: [], noConflict: 0, hasMarks: false };
  const free = {}, pref = {}, busy = {};
  const marks = new Set();
  for (const p of people) {
    const lset = new Set(Object.keys(p.locked || {}));
    for (const d of p.days) if (!lset.has(d)) { free[d] = (free[d] || 0) + 1; marks.add(d); }
    for (const d of (p.prefers || [])) if (!lset.has(d)) pref[d] = (pref[d] || 0) + 1;
    for (const d of (p.busy || [])) { busy[d] = (busy[d] || 0) + 1; marks.add(d); }
    for (const d of lset) { busy[d] = (busy[d] || 0) + 1; marks.add(d); }
  }
  const marked = [...marks].sort();
  if (!marked.length) return { windows: [], noConflict: 0, hasMarks: false };

  // how many count as available on a day, per the chosen rule
  const avail = (ds) => state.availMode === "free" ? (free[ds] || 0) : (total - (busy[ds] || 0));
  const start = parse(marked[0]), end = parse(marked[marked.length - 1]);
  const all = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) all.push(fmt(d));
  const noConflict = all.filter((ds) => !(busy[ds] || 0)).length;

  const windows = [];
  let i = 0;
  while (i < all.length) {
    if (total - avail(all[i]) <= state.maxDrop) {
      let j = i;
      while (j < all.length && total - avail(all[j]) <= state.maxDrop) j++;
      const run = all.slice(i, j);
      if (run.length >= state.minLen) {
        const busyMap = new Map(), unconfirmed = new Set();
        let prefSum = 0, freeSum = 0;
        for (const rd of run) {
          prefSum += pref[rd] || 0; freeSum += free[rd] || 0;
          for (const p of people) {
            const lk = p.locked && p.locked[rd];
            if (lk) {
              if (!busyMap.has(p.name)) busyMap.set(p.name, new Set());
              busyMap.get(p.name).add(lk);
            } else if ((p.busy || []).includes(rd)) {
              if (!busyMap.has(p.name)) busyMap.set(p.name, new Set());
              const r = (p.busyReasons || {})[rd];
              if (r) busyMap.get(p.name).add(r);
            } else if (!p.days.includes(rd)) unconfirmed.add(p.name);
          }
        }
        const busy = [...busyMap.entries()]
          .map(([name, rs]) => ({ name, reasons: [...rs] }))
          .sort((a, b) => a.name.localeCompare(b.name));
        windows.push({ from: run[0], to: run[run.length - 1], len: run.length,
          busy, unconfirmed: [...unconfirmed],
          prefScore: prefSum / run.length, freeScore: freeSum / run.length,
          preferred: prefSum / run.length >= 1 });
      }
      i = j;
    } else i++;
  }
  // fewest conflicts first, then the dates people prefer, then most confirmed, then longest
  windows.sort((a, b) =>
    a.busy.length - b.busy.length ||
    b.prefScore - a.prefScore ||
    b.freeScore - a.freeScore ||
    b.len - a.len);
  return { windows: windows.slice(0, 12), noConflict, hasMarks: true };
}

/* ---- encryption (runs in the browser; the server only ever sees ciphertext) ---- */
const b64 = (bytes) => { const a = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes); let s = ""; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const ub64 = (str) => { const bin = atob(str); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
async function deriveKey(passphrase, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptJSON(obj, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
async function decryptJSON(blob, passphrase) {
  const key = await deriveKey(passphrase, ub64(blob.salt));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(blob.iv) }, key, ub64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const cryptoReady = () => !!(window.crypto && crypto.subtle);

async function toggleDay(ds) {
  const p = currentPerson(); if (!p) return;
  if (p.locked && p.locked[ds]) return;   // committed to another trip — read-only here
  const prefers = p.prefers || [], busy = p.busy || [], reasons = p.busyReasons || {};
  let days = p.days, prefs = prefers, bus = busy, rs = { ...reasons };
  if (state.markMode === "busy") {
    if (busy.includes(ds)) {                 // busy -> clear
      bus = busy.filter((d) => d !== ds); delete rs[ds];
    } else {                                  // anything -> busy (clears free/pref)
      bus = [...busy, ds];
      if (state.busyReason) rs[ds] = state.busyReason;
      days = p.days.filter((d) => d !== ds);
      prefs = prefers.filter((d) => d !== ds);
    }
  } else {
    if (busy.includes(ds)) {                  // busy -> free
      bus = busy.filter((d) => d !== ds); delete rs[ds];
      days = [...p.days, ds];
    } else if (!p.days.includes(ds)) {         // clear -> free
      days = [...p.days, ds];
    } else if (!prefers.includes(ds)) {        // free -> preferred
      prefs = [...prefers, ds];
    } else {                                    // preferred -> clear
      days = p.days.filter((d) => d !== ds);
      prefs = prefers.filter((d) => d !== ds);
    }
  }
  p.days = days; p.prefers = prefs; p.busy = bus; p.busyReasons = rs;
  state.lastEditAt = Date.now();
  updateRoster(); updateCalendar(); updateResults();
  await savePerson(p);
}

/* ---- drag to fill a range (pointer = mouse + touch) ---- */
function paintDay(ds, action) {
  const p = currentPerson(); if (!p) return;
  if (p.locked && p.locked[ds]) return;   // locked by another trip
  if (!p.busyReasons) p.busyReasons = {};
  const rm = (arr) => (arr || []).filter((d) => d !== ds);
  if (action === "setFree") {
    p.busy = rm(p.busy); delete p.busyReasons[ds];
    if (!p.days.includes(ds)) p.days = [...p.days, ds];
  } else if (action === "clearFree") {
    p.days = rm(p.days); p.prefers = rm(p.prefers);
  } else if (action === "setBusy") {
    p.days = rm(p.days); p.prefers = rm(p.prefers);
    if (!(p.busy || []).includes(ds)) p.busy = [...(p.busy || []), ds];
    if (state.busyReason) p.busyReasons[ds] = state.busyReason;
  } else if (action === "clearBusy") {
    p.busy = rm(p.busy); delete p.busyReasons[ds];

  updateDayCell(ds);

function onCalPointerDown(e) {
  const cell = e.target.closest("[data-day]");
  if (!cell || !state.selectedId) return;
  const p = currentPerson(); if (!p) return;
  const ds = cell.dataset.day;
  let action;
  if (state.markMode === "busy") action = (p.busy || []).includes(ds) ? "clearBusy" : "setBusy";
  else action = p.days.includes(ds) ? "clearFree" : "setFree";
  state.drag = { startDs: ds, action, moved: false, days: new Set() };
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd);
  window.addEventListener("pointercancel", onDragEnd);
}
function onDragMove(e) {
  if (!state.drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest ? el.closest("[data-day]") : null;
  if (!cell) return;
  const ds = cell.dataset.day;
  if (!state.drag.moved) {
    state.drag.moved = true;
    paintDay(state.drag.startDs, state.drag.action);
    state.drag.days.add(state.drag.startDs);
  }
  if (!state.drag.days.has(ds)) { paintDay(ds, state.drag.action); state.drag.days.add(ds); }
  e.preventDefault();
}
async function onDragEnd() {
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragEnd);
  window.removeEventListener("pointercancel", onDragEnd);
  const drag = state.drag; state.drag = null;
  if (!drag) return;
  if (!drag.moved) { toggleDay(drag.startDs); return; } // a plain tap → cycle
  const p = currentPerson();
  state.lastEditAt = Date.now();
  updateRoster(); updateResults();

/* ---- rendering ---- */
function dayInfo(ds) {
  let free = 0, busy = 0; const bnames = [];
  for (const p of state.people) {
    const lk = p.locked && p.locked[ds];
    if (lk) { busy++; bnames.push(`${p.name} (${lk})`); continue; }
    if ((p.busy || []).includes(ds)) {
      busy++;
      const r = (p.busyReasons || {})[ds];
      bnames.push(r ? `${p.name} (${r})` : p.name);
    } else if (p.days.includes(ds)) free++;
  }
  let title = "";
  if (free) title += `${free} free`;
  if (busy) title += (title ? " · " : "") + "busy: " + bnames.join(", ");
  return { free, busy, title };
}

  if (busy > 0) { const r = busy / total; return r >= 1 ? "b-all" : r >= 0.5 ? "b-some" : "b-few"; }
  if (free > 0) { const r = free / total; return r === 1 ? "h-all" : r >= 0.75 ? "h-most" : r >= 0.5 ? "h-half" : "h-few"; }
  return "h-none";
}

    const iBusy = selected && (selected.busy || []).includes(ds);
    const myPref = selected && (selected.prefers || []).includes(ds);
    html += `<button class="day ${dayClass(f, b, total)} ${iFree ? "mine" : ""} ${(iBusy || iLocked) ? "mine-busy" : ""} ${iLocked ? "locked" : ""} ${ds === today ? "today" : ""} ${selected ? "" : "disabled"}" data-day="${ds}" ${title ? `title="${escapeHtml(title)}"` : ""} ${selected ? "" : "disabled"}>
      ${cellInner(d, f, b, myPref, iLocked || "")}
    </button>`;
  }
  document.getElementById("calGrid").innerHTML = html;
}

function updateResults() {
  const total = state.people.length;
  const { windows, noConflict, hasMarks } = computeWindows();
  const box = document.getElementById("results");
  let body;
  if (!total) {
    body = `<p class="hint">Add people, then mark days to see what fits.</p>`;
  } else if (!hasMarks) {
    body = `<p class="hint">Mark some days — free or busy — and the windows that work will show up here.</p>`;
  } else if (!windows.length) {
    body = `<p class="hint">Nothing fits with these settings. Try a shorter minimum length, or allow more people to miss it.</p>`;
  } else {
    const strict = state.availMode === "free";
    const inGroup = !!state.group;
    body = "";
    if (inGroup && state.lockFrom) {
      body += `<div class="lockbar">
        <span>Locked in: <span class="rng">${prettyRange(state.lockFrom, state.lockTo)}</span> — blocked in your other trips</span>
        <button class="btn small" data-unlock>Unlock</button>
      </div>`;
    }
    body += "<ul>" + windows.map((w) => {
      const clear = w.busy.length === 0 && (!strict || w.unconfirmed.length === 0);
      let note;
      if (clear) note = "no conflicts";
      else {
        const parts = [];
        if (w.busy.length) {
          const names = w.busy.map((b) =>
            escapeHtml(b.name) + (b.reasons.length ? ` (${b.reasons.map(escapeHtml).join(", ")})` : ""));
          parts.push("busy: " + names.join(", "));
        }
        if (strict && w.unconfirmed.length) parts.push("not confirmed: " + w.unconfirmed.map(escapeHtml).join(", "));
        note = parts.join(" · ");
      }
      const isLocked = inGroup && state.lockFrom === w.from && state.lockTo === w.to;
      return `<li class="win ${clear ? "clear" : ""}">
        <div>
          <div class="range">${prettyRange(w.from, w.to)}</div>
          <div class="meta">${w.len} day${w.len === 1 ? "" : "s"} in a row &middot; ${note}</div>
          ${inGroup ? `<button class="btn small lockbtn" ${isLocked ? "disabled" : ""} data-lock="${w.from}|${w.to}">${isLocked ? "Locked" : "Lock these dates"}</button>` : ""}
        </div>
        <div class="tags">
          ${w.preferred ? `<span class="badge pref">&#9733; preferred</span>` : ""}
          ${clear ? `<span class="badge clear">clear</span>` : ""}
        </div>
      </li>`;
    }).join("") + "</ul>";
    if (noConflict > 0) {
      body += `<p class="summary"><b>${noConflict}</b> day${noConflict === 1 ? "" : "s"} in range ` +
              `${noConflict === 1 ? "has" : "have"} nobody marked busy.</p>`;
    }
  }
  box.innerHTML = body;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function lockTrip(from, to) {
  state.lockFrom = from; state.lockTo = to;
  const t = state.groupTrips.find((x) => x.room === state.room);
  if (t) { t.lock_from = from; t.lock_to = to; }
  updateResults();
  await tripSetLock(state.room, from, to);
}
async function unlockTrip() {
  state.lockFrom = null; state.lockTo = null;
  const t = state.groupTrips.find((x) => x.room === state.room);
  if (t) { t.lock_from = null; t.lock_to = null; }
  updateResults();
  await tripSetLock(state.room, null, null);
}

async function bkSave() {
  const msg = document.getElementById("bkMsg");
  const setMsg = (t, cls) => { msg.textContent = t; msg.className = "hint" + (cls ? " " + cls : ""); };
  if (!cryptoReady()) return setMsg("Encryption needs a secure page — open this over http://localhost or your https:// site.", "fail");
  const val = (id) => document.getElementById(id).value.trim();
  const name = val("bkFull"), dob = val("bkDob"), pass = document.getElementById("bkPass").value;
  if (!name || !dob) return setMsg("Full name and date of birth are required.", "fail");
  if (!pass) return setMsg("Enter the trip passphrase your group agreed on.", "fail");
  const details = { fullName: name, dob, nationality: val("bkNat"), passport: val("bkPassport"), expiry: val("bkExp"), notes: val("bkNotes") };
  setMsg("Encrypting…");
  try {
    const blob = await encryptJSON(details, pass);
    const ok = await bkUpsert(name, blob);
    if (!ok) return setMsg("Couldn't save — check your connection.", "fail");
    document.getElementById("bkPass").value = "";
    setMsg("Saved and encrypted. Only the trip passphrase can read it.", "ok");
    await loadBookings();
  } catch (e) { setMsg("Encryption failed: " + e.message, "fail"); }
}

async function bkUnlock() {
  const out = document.getElementById("bkReveal");
  if (!cryptoReady()) { out.innerHTML = `<p class="fail">Encryption needs http://localhost or an https:// site.</p>`; return; }
  const pass = document.getElementById("bkUnlockPass").value;
  if (!pass) { out.innerHTML = `<p class="hint">Enter the trip passphrase.</p>`; return; }
  if (!state.bookings.length) { out.innerHTML = `<p class="hint">No details submitted yet.</p>`; return; }
  out.innerHTML = `<p class="hint">Unlocking…</p>`;
  const ok = [], fail = [];
  for (const b of state.bookings) {
    try { ok.push({ name: b.name, d: await decryptJSON(b.blob, pass) }); }
    catch (e) { fail.push(b.name); }
  }
  let html = "";
  if (ok.length) {
    html += `<table class="rev"><thead><tr><th>Name</th><th>DOB</th><th>Nationality</th><th>Passport</th><th>Expiry</th><th>Notes</th><th></th></tr></thead><tbody>`;
    html += ok.map(({ name, d }) => `<tr>
        <td>${escapeHtml(d.fullName || name)}</td><td>${escapeHtml(d.dob || "")}</td>
        <td>${escapeHtml(d.nationality || "")}</td><td>${escapeHtml(d.passport || "")}</td>
        <td>${escapeHtml(d.expiry || "")}</td><td>${escapeHtml(d.notes || "")}</td>
        <td><button class="btn small" data-copy="${escapeHtml(JSON.stringify(d))}">Copy</button></td>
      </tr>`).join("");
    html += `</tbody></table><button class="btn small" id="copyAll" style="margin-top:10px;">Copy all</button>`;
  }
  if (fail.length) html += `<p class="fail">Couldn't unlock: ${fail.map(escapeHtml).join(", ")} — likely saved with a different passphrase.</p>`;
  html += `<p class="hint">Shown only on your screen. Close the tab when you're done, and delete the details after booking.</p>`;
  out.innerHTML = html;
  out.querySelectorAll("[data-copy]").forEach((btn) => (btn.onclick = () => {
    navigator.clipboard.writeText(fmtDetail(JSON.parse(btn.dataset.copy)));
    btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200);
  }));
  const all = document.getElementById("copyAll");
  if (all) all.onclick = () => {
    navigator.clipboard.writeText(ok.map(({ d }) => fmtDetail(d)).join("\n"));
    all.textContent = "Copied all"; setTimeout(() => (all.textContent = "Copy all"), 1200);
  };
}

/* ---- polling (keeps everyone in sync, no extra setup) ---- */
async function poll() {
  if (!sb || document.visibilityState !== "visible") return;

  if (state.mode === "group") {                 // hub: refresh roster + trip list
    state.members = await membersFetch(state.group);
    state.groupTrips = await tripsByGroup(state.group);
    updateMembers(); updateTripsList();
    return;
  }

  if (state.tab !== "schedule" || state.drag) return;   // not while booking or mid-drag
  if (Date.now() - state.lastEditAt < 2500) return;      // don't stomp a fresh local edit
  const meta = await tripMetaFetch(state.room);
  if (meta.name !== state.tripName) { state.tripName = meta.name; updateBoardName(); }
  state.lockFrom = meta.lock_from; state.lockTo = meta.lock_to;
  const rows = await dbFetch();
  if (!rows) return;
  state.people = rows;
  if (state.group) {
    state.groupTrips = await tripsByGroup(state.group);   // other trips' locks may have changed
    applyOverlay(await overlayFetch());
  }
  if (!state.people.find((p) => p.id === state.selectedId)) state.selectedId = state.people[0]?.id ?? null;
  updateAll();
}

          <div class="card" id="tripsCard">
            <h2>Trips <span class="count" id="tripCount">0</span></h2>
            <button class="btn primary" id="newTripBtn" style="width:100%;justify-content:center;">New trip</button>
            <ul class="triplist" id="tripList"></ul>
          </div>
          <p class="footnote">Send the <b>Invite link</b> so friends join the group once. Each trip still has its own link and its own booking details.</p>
        </div>
      </div>
    </div>`;

  document.getElementById("gCopyBtn").onclick = copyGroupInvite;
  document.getElementById("editGroupName").onclick = renameGroup;
  document.getElementById("memberAddBtn").onclick = addGroupMember;
  document.getElementById("memberInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addGroupMember(); });
  document.getElementById("newTripBtn").onclick = newGroupTrip;
  document.getElementById("memberList").addEventListener("click", (e) => {
    const del = e.target.closest("[data-delmember]");
    if (del) removeGroupMember(del.dataset.delmember);
  });
  document.getElementById("tripList").addEventListener("click", (e) => {
    const open = e.target.closest("[data-open]");
    if (open) location.search = "?room=" + encodeURIComponent(open.dataset.open);
  });
  updateMembers();
  updateTripsList();
}
function updateGroupName() {
  const el = document.getElementById("groupName");
  if (!el) return;
  el.textContent = state.groupName ? state.groupName : "Name this group";
  el.classList.toggle("placeholder", !state.groupName);
}
async function renameGroup() {
  const next = window.prompt("Name this group", state.groupName || "");
  if (next === null) return;
  state.groupName = next.trim().slice(0, 60);
  updateGroupName();
  await groupSetName(state.groupName);
}
function updateMembers() {
  const el = document.getElementById("memberList");
  if (!el) return;
  document.getElementById("memberCount").textContent = state.members.length;
  el.innerHTML = state.members.length
    ? state.members.map((m) => `
        <li class="person">
          <span class="name" style="flex:1;">${escapeHtml(m.name)}</span>
          <button class="del" data-delmember="${m.id}" title="Remove from group">&times;</button>
        </li>`).join("")
    : `<li class="empty">No members yet. Add your friends above.</li>`;
}
function updateTripsList() {
  const el = document.getElementById("tripList");
  if (!el) return;
  document.getElementById("tripCount").textContent = state.groupTrips.length;
  el.innerHTML = state.groupTrips.length
    ? state.groupTrips.map((t) => `
        <li class="triprow">
          <button class="pick" data-open="${t.room}" style="flex:1;background:none;border:0;padding:0;cursor:pointer;text-align:left;">
            <span class="tname">${t.name ? escapeHtml(t.name) : "Untitled trip"}</span>
            <span class="tcode"> &middot; ${escapeHtml(t.room.toUpperCase())}</span>
          </button>
          ${t.lock_from ? `<span class="tlock">&#128274; ${prettyRange(t.lock_from, t.lock_to)}</span>` : ""}
        </li>`).join("")
    : `<li class="empty">No trips yet. Start one with New trip.</li>`;
}
async function addGroupMember() {
  const input = document.getElementById("memberInput");
  const nm = input.value.trim();
  if (!nm) return;
  input.value = "";
  const m = await memberAdd(state.group, nm);
  if (!m) return;
  state.members = [...state.members, m].sort((a, b) => a.name.localeCompare(b.name));
  updateMembers();
}
async function removeGroupMember(id) {
  state.members = state.members.filter((m) => m.id !== id);
  updateMembers();
  await memberDelete(id);
}
async function newGroupTrip() {
  const nm = (window.prompt("Name this trip (optional)", "") || "").trim().slice(0, 60);
  const room = Math.random().toString(36).slice(2, 9);
  await tripCreateInGroup(room, state.group, nm);
  // put the whole roster on the new trip by default
  for (const m of state.members) {
    await sb.from("people").insert({ room, member_id: m.id, name: m.name, days: [], prefers: [], busy: [], busy_reasons: {} });
  }
  location.search = "?room=" + room;
}
function renderLanding() {
  document.getElementById("app").innerHTML = `
    <div class="landing">
      <div class="pass">
        <div class="pass-top">
          <span class="plane">&#9992;</span>
          <span class="eyebrow">Trip Planner &middot; Boarding</span>
        </div>
        <div class="pass-body">
          <h1>Plan a trip together</h1>
          <p>Everyone marks when they can travel. You see the stretches that fit — then one person books.</p>
          ${configured ? `
            <button class="btn primary" id="createBtn" style="width:100%;justify-content:center;">Start a new trip</button>
            <button class="btn" id="createGroupBtn" style="width:100%;justify-content:center;margin-top:8px;">Start a group of trips</button>
            <p class="or">or join one</p>
            <div class="row">
              <input class="inp" id="joinCode" placeholder="Enter a trip or group code" />
              <button class="btn" id="joinBtn">Join</button>
            </div>
            <p class="hint" style="margin-top:10px;">A <b>group</b> keeps one list of friends across many trips, and blocks dates you've locked in one trip from clashing with the others.</p>
          ` : `
            <div class="setup">
              Almost there — open <code>index.html</code> and paste your Supabase
              <code>Project URL</code> and <code>publishable key</code> into the CONFIG
              section at the top. The README walks through it.
            </div>
          `}
        </div>
      </div>
    </div>`;
  if (!configured) return;
  document.getElementById("createBtn").onclick = () => {
    const code = Math.random().toString(36).slice(2, 9);
    location.search = "?room=" + code;
  };
  document.getElementById("createGroupBtn").onclick = async () => {
    const code = Math.random().toString(36).slice(2, 9);
    await groupCreate(code, "");
    location.search = "?group=" + code;
  };
  document.getElementById("joinBtn").onclick = joinFromInput;
  document.getElementById("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") joinFromInput(); });
}
async function joinFromInput() {
  const code = document.getElementById("joinCode").value.trim();
  if (!code) return;
  const g = await groupFetch(code);            // a group code takes you to the hub
  location.search = (g ? "?group=" : "?room=") + encodeURIComponent(code);
}

/* ---- boot ---- */
async function boot() {
  const params = new URLSearchParams(location.search);
  const room = params.get("room"), group = params.get("group");
  if (!configured) { renderLanding(); return; }

  if (room) {
    state.mode = "trip";
    state.room = room;
    const meta = await tripMetaFetch(room);
    state.tripName = meta.name;
    state.group = meta.group_code;
    state.lockFrom = meta.lock_from; state.lockTo = meta.lock_to;
    if (state.group) {
      const g = await groupFetch(state.group);
      state.groupName = g ? g.name : "";
      state.members = await membersFetch(state.group);
      state.groupTrips = await tripsByGroup(state.group);
    }
    render();
    const rows = await dbFetch();
    if (rows) {
      state.people = rows;
      if (state.group) applyOverlay(await overlayFetch());
      state.selectedId = state.people[0]?.id ?? null;
      if (state.tab === "schedule") updateAll();
    }
  } else if (group) {
    const g = await groupFetch(group);
    if (!g) { renderLanding(); return; }
    state.mode = "group";
    state.group = group; state.groupName = g.name;
    state.members = await membersFetch(group);
    state.groupTrips = await tripsByGroup(group);
    renderGroup();
  } else {
    renderLanding();
    return;
  }
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
}
boot();
</script>
</body>
</html>
